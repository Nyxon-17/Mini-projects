<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <h1>Calculator</h1>
    <div class="container">
        <div>
            <input type="text" class="display">
        </div>

        <div class="row">
            <button class="button color-orange"><i class="fa-solid fa-delete-left"></i></button>
            <button class="button color-orange" style="font-size: 30px;">AC</button>
            <button class="button color-orange">%</button>
            <button class="button color-orange">/</button>
        </div>
        <div class="row">
            <button class="button">7</button>
            <button class="button">8</button>
            <button class="button">9</button>
            <button class="button color-orange">*</button>
        </div>
        <div class="row">
            <button class="button">6</button>
            <button class="button">5</button>
            <button class="button">4</button>
            <button class="button color-orange">+</button>
        </div>
        <div class="row">
            <button class="button">3</button>
            <button class="button">2</button>
            <button class="button">1</button>
            <button class="button color-orange">-</button>
        </div>
        <div class="row">
            <!-- <button class="button">*</button> -->
            <button class="button" id="bigZero">0</button>
            <button class="button">.</button>
            <button class="button color-orange">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
